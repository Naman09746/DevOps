version: '3.8'

services:
  web-app:
    build: .
    image: devops-microservice:1.0.0
    container_name: devops-web-container
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - APP_VERSION=1.0.0
    volumes:
      - app-data:/app/data
    networks:
      - app-net
    restart: always

volumes:
  app-data:
    driver: local

networks:
  app-net:
    driver: bridge
