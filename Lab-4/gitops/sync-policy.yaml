# ArgoCD Sync Policy & Automated Self-Healing Specification
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Polling interval for detecting upstream Git changes (default is 3m)
  timeout.reconciliation: "60s"
  # Drift detection and automatic correction
  resource.customizations: |
    apps/Deployment:
      health.lua: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.observedGeneration < obj.metadata.generation then
            hs.status = "Progressing"
            hs.message = "Waiting for rollout"
            return hs
          end
          if obj.status.availableReplicas == obj.status.replicas then
            hs.status = "Healthy"
            return hs
          end
        end
        hs.status = "Progressing"
        return hs
