apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-app-canary
  namespace: default
  labels:
    app: enterprise-app
    track: canary
    version: "2.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-app
      track: canary
  template:
    metadata:
      labels:
        app: enterprise-app
        track: canary
        version: "2.0.0"
    spec:
      containers:
        - name: app
          image: ghcr.io/naman09746/enterprise-service:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: ENVIRONMENT
              value: "canary"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
