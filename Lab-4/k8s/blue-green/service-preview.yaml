apiVersion: v1
kind: Service
metadata:
  name: enterprise-app-preview
  namespace: default
  labels:
    app: enterprise-app
    role: pre-release-verification-router
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: enterprise-app
    color: green  # Preview router allows QA/DevOps validation before live cutover
