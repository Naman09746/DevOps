apiVersion: v1
kind: Service
metadata:
  name: enterprise-app-live
  namespace: default
  labels:
    app: enterprise-app
    role: live-traffic-router
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: enterprise-app
    color: blue  # Production router initially routes 100% traffic to Blue
