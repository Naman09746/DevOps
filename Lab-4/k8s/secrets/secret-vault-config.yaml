# HashiCorp Vault Agent Injector & External Secret Configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-service-vault-injected
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-service-vault
  template:
    metadata:
      labels:
        app: enterprise-service-vault
      annotations:
        # HashiCorp Vault Sidecar Agent Injection Annotations
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "enterprise-app-role"
        vault.hashicorp.com/agent-inject-secret-database-config.txt: "secret/data/production/database"
        vault.hashicorp.com/agent-inject-template-database-config.txt: |
          {{- with secret "secret/data/production/database" -}}
          export DB_USER="{{ .Data.data.username }}"
          export DB_PASSWORD="{{ .Data.data.password }}"
          export API_KEY="{{ .Data.data.api_key }}"
          {{- end -}}
    spec:
      serviceAccountName: enterprise-vault-sa
      containers:
        - name: app
          image: ghcr.io/naman09746/enterprise-service:1.0.0
          command: ["/bin/sh", "-c"]
          args: [". /vault/secrets/database-config.txt && python3 app.py"]
          ports:
            - containerPort: 8080
---
# External Secrets Operator (ESO) Alternative Pattern
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enterprise-vault-externalsecret
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend-store
    kind: SecretStore
  target:
    name: enterprise-synced-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: production/database
        property: password
