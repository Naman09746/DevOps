# Role-Based Access Control (RBAC) - Least Privilege Standard
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enterprise-vault-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enterprise-secret-reader-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch"]
    resourceNames: ["enterprise-db-credentials", "enterprise-synced-credentials"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enterprise-secret-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: enterprise-vault-sa
    namespace: default
roleRef:
  kind: Role
  name: enterprise-secret-reader-role
  apiGroup: rbac.authorization.k8s.io
